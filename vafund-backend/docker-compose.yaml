version: '3.8'
services:
  backend:
    build: .
    container_name: vafund-backend
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./crypto:/app/crypto
    depends_on:
      - db
    restart: unless-stopped
  db:
    image: postgres:15
    container_name: vafund-postgres
    environment:
      POSTGRES_DB: vafund
      POSTGRES_USER: vafunduser
      POSTGRES_PASSWORD: vafundpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
volumes:
  pgdata:
